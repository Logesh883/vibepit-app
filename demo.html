<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VibePit Tour</title>
<meta name="description" content="See how VibePit works, step by step: open a project, read Claude’s plan, answer its questions with a click, see the result, and carry on from your phone.">
<meta property="og:title" content="VibePit Tour">
<meta property="og:description" content="A two-minute tour of VibePit: one window for all your Claude Code sessions.">
<meta property="og:image" content="vibepit-logo.png">
<meta name="theme-color" content="#0e0f11">
<script>try{var t=localStorage.getItem("vp-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="theme.js" defer></script>
<link rel="icon" href="vibepit-logo.png">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* The tour fills one screen: the steps on the left, the app on the right, scaled to whatever
   room the window has, so nothing needs scrolling on a laptop. The homepage's look: a dark
   field, square edges, the app's own type and colours. The app plays in demo-app.html. */
@font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --ground: #f7f6f3; --tone: #e9e7e1; --tone-2: #dfddd6; --hover: #d6d4cc; --ink: #1b1b1d; --muted: #55555b;
  --accent: #3557d4; --on-accent: #ffffff;
  --font: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --margin: clamp(16px, 2.4vw, 32px); --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0e0f11; --tone: #17181b; --tone-2: #1f2024; --hover: #2a2c31; --ink: #ededee; --muted: #a9a9af;
  --accent: #8fa8ff; --on-accent: #0e0f11; color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground: #0e0f11; --tone: #17181b; --tone-2: #1f2024; --hover: #2a2c31; --ink: #ededee; --muted: #a9a9af;
  --accent: #8fa8ff; --on-accent: #0e0f11; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, p, ol { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border: 0; background: var(--accent); color: var(--on-accent); font: 600 15px/1 var(--font); text-decoration: none; cursor: pointer; transition: background-color .15s, color .15s, transform .15s var(--ease); }
.btn:hover { background: var(--ink); color: var(--ground); }
.btn:active { transform: scale(.97); }
.btn.quiet { background: var(--tone-2); color: var(--ink); }
.btn.quiet:hover { background: var(--hover); }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }

/* the page is exactly one screen tall on a laptop: the bar, then the tour */
.page { height: 100svh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px var(--margin); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; text-decoration: none; }
.brand img { width: 28px; height: 28px; }
.bar nav { display: flex; align-items: center; gap: 28px; font-size: 15px; }
.bar nav a:not(.btn) { text-decoration: none; color: var(--muted); transition: color .15s; }
.bar nav a:not(.btn):hover, .bar nav a[aria-current] { color: var(--ink); }

.tour { display: grid; grid-template-columns: clamp(300px, 24vw, 380px) minmax(0, 1fr); gap: var(--margin); padding: 4px var(--margin) var(--margin); min-height: 0; }

/* the rail: title, the steps (the current one open with what it shows), the controls */
.rail { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 20px; min-height: 0; }
.rail h1 { font-size: 28px; line-height: 1.1; font-weight: 600; letter-spacing: -.025em; }
.rail .intro { margin-top: 8px; color: var(--muted); font-size: 15px; }
.steps { list-style: none; padding: 0; display: grid; align-content: start; gap: 4px; overflow-y: auto; min-height: 0; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.steps button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 11px 14px; background: var(--tone); cursor: pointer; position: relative; overflow: hidden; transition: background-color .2s; }
.steps button:hover { background: var(--tone-2); }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.steps .t { display: block; font-weight: 600; font-size: 16px; color: var(--muted); }
.steps .seen .t { color: var(--ink); }
.steps .s { display: none; margin-top: 6px; font-size: 15px; line-height: 1.5; color: var(--ink); }
.steps .h { display: none; margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--accent); }
.steps .h:empty { display: none !important; }
.steps button[aria-current="step"] { background: var(--tone-2); padding-block: 14px 16px; }
.steps button[aria-current="step"] .t { color: var(--ink); }
.steps button[aria-current="step"] .s, .steps button[aria-current="step"] .h { display: block; }
.steps button::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); }
.steps button[aria-current="step"]::after { width: var(--p, 0%); transition: width .3s linear; }
.ctl { display: grid; gap: 14px; }
.ctl .row { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; }
.fine { font-size: 13px; color: var(--muted); }
.fine a { color: var(--ink); }

/* the app, scaled to fit the room left, both ways, and centred in it */
.room { position: relative; min-height: 0; min-width: 0; display: grid; place-items: center; }
.window { position: relative; overflow: hidden; border-radius: 12px; background: var(--tone); }
.window iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 760px; border: 0; transform-origin: 0 0; display: block; }

/* a phone or a short window: the page scrolls; the app on top, then the controls and the steps */
@media (max-width: 900px), (max-height: 560px) {
  .page { height: auto; display: block; }
  .bar nav a:not(.btn):not([aria-current]):not([href="index.html"]) { display: none; }
  .tour { grid-template-columns: minmax(0, 1fr); padding-bottom: 40px; }
  .room { order: -1; display: block; }
  .rail { grid-template-rows: none; }
  .steps { overflow: visible; }
  .rail { display: flex; flex-direction: column; }
  .ctl { order: -1; }
}
@media (prefers-reduced-motion: reduce) { .btn, .steps button { transition: none; } }

/* the theme button (theme.js), and a soft change of colour when it is pressed */
.theme { all: unset; box-sizing: border-box; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; color: var(--muted); background: var(--tone); transition: color .2s, background-color .2s, transform .3s; }
.theme:hover { color: var(--ink); background: var(--tone-2); }
.theme:active { transform: rotate(-20deg) scale(.94); }
.theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme svg { width: 18px; height: 18px; }
.theme .sun, :root[data-theme="dark"] .theme .moon { display: none; }
:root[data-theme="dark"] .theme .sun { display: block; }
.theming, .theming *, .theming *::before, .theming *::after { transition-property: background-color, color, border-color, fill !important; transition-duration: .4s !important; transition-delay: 0s !important; }
@media (max-width: 560px) { .bar nav { gap: 14px; } .bar nav a[aria-current] { display: none; } .bar .brand { font-size: 0; gap: 0; } }
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <a class="brand" href="index.html"><img src="vibepit-logo.png" alt="" width="28" height="28">VibePit</a>
    <nav aria-label="Site">
      <a href="index.html">Home</a>
      <a href="index.html#features">Features</a>
      <a href="demo.html" aria-current="page">Tour</a>
      <a href="setup.html">Setup guide</a>
      <a href="release-notes.html">Release notes</a>
      <button type="button" class="theme" aria-label="Switch theme"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <a class="btn dl" href="https://github.com/Logesh883/vibepit-app/releases/latest/download/VibePit-arm64.dmg">Download</a>
    </nav>
  </header>

  <main class="tour">
    <div class="rail">
      <div>
        <h1>The two-minute tour</h1>
        <p class="intro">VibePit with a made-up project, route-map. Let it play, or press the buttons yourself when Claude asks.</p>
      </div>
      <ol class="steps" id="steps" aria-label="Steps of the tour" aria-live="polite"></ol>
      <div class="ctl">
        <div class="row">
          <button type="button" class="btn quiet" id="back" aria-label="Previous step"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
          <button type="button" class="btn" id="play">Play</button>
          <button type="button" class="btn quiet" id="next" aria-label="Next step">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <p class="fine">A mock: nothing here connects to Claude. Ready for the real thing? <a class="dl" href="https://github.com/Logesh883/vibepit-app/releases/latest/download/VibePit-arm64.dmg">Download for Mac</a>, free.</p>
      </div>
    </div>
    <div class="room" id="room">
      <div class="window" id="window"><iframe id="mock" src="demo-app.html" title="A mock of the VibePit window, playing the tour" scrolling="no"></iframe></div>
    </div>
  </main>
</div>

<script>
// The tour plays inside the frame (demo-app.html, the app's own look). This page lists its steps,
// says what each one shows, and passes your clicks on to it.
const $ = (s) => document.querySelector(s);
const STEPS = [
  { title: "Open a project",
    say: "Type “open route-map” in the Chat. VibePit opens the project in VS Code with a Claude tab, and the tab appears in the Chats list." },
  { title: "Ask Claude for a plan",
    say: "In plan mode, Claude studies your code and proposes a plan before it changes anything. The plan opens beside the Chat, laid out like a document." },
  { title: "Approve, and follow along",
    say: "Approve the plan with one click. While Claude works, the Chat shows the files it reads and edits and the commands it runs." },
  { title: "Answer when Claude asks",
    say: "When Claude needs your permission, the request appears in the Chat with buttons. Press Yes, or tell Claude what to do instead." },
  { title: "Read the result first",
    say: "The answer starts with a one-line headline, with its pull request and checks under it, and replies you can send with one click." },
  { title: "Many projects at once",
    say: "Every Claude tab in every project is in one list, showing whether it is working, ready or needs you, with your 5-hour and weekly limits below." },
  { title: "Carry on from your phone",
    say: "Scan a QR code, press Allow on the Mac, and your phone shows the same Chat in its browser, on your Wi-Fi or from anywhere." },
];
const frame = $("#mock"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let S = { step: 0, stepDone: false, auto: false, hint: "", begun: false };
const send = (m) => frame.contentWindow.postMessage({ tour: m.tour, n: m.n }, "*");

$("#steps").innerHTML = STEPS.map((s, i) => `<li><button type="button" data-i="${i}"><span class="t">${s.title}</span><span class="s">${s.say}</span><span class="h"></span></button></li>`).join("");
function chrome() {
  document.querySelectorAll("#steps button").forEach((b, i) => {
    if (i === S.step) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    b.classList.toggle("seen", S.begun && i < S.step);
    b.style.setProperty("--p", i === S.step && S.stepDone ? "100%" : "0%");
    b.querySelector(".h").textContent = i === S.step ? S.hint : "";
  });
  $("#back").disabled = S.step === 0;
  $("#next").disabled = S.step === STEPS.length - 1;
  $("#play").textContent = S.auto ? "Pause" : S.step === STEPS.length - 1 && S.stepDone ? "Play again" : "Play";
}
addEventListener("message", (e) => {
  if (e.source !== frame.contentWindow || !e.data || e.data.tour !== "state") return;
  const was = S.step; S = e.data; chrome();
  // on a laptop the step list scrolls to the current step; on a phone the page stays where you are
  if (S.step !== was && !matchMedia("(max-width: 900px), (max-height: 560px)").matches) document.querySelector('#steps [aria-current="step"]')?.scrollIntoView({ block: "nearest" });
});
$("#steps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) send({ tour: "go", n: +b.dataset.i }); });
$("#back").onclick = () => send({ tour: "back" });
$("#next").onclick = () => send({ tour: "next" });
$("#play").onclick = () => send({ tour: "play" });

// The app is drawn at a desktop size (1280 × 760) and scaled to fit the room both ways; on a
// phone, at a narrower size, scaled to the width.
function fit() {
  const room = $("#room"), win = $("#window"), narrow = matchMedia("(max-width: 900px), (max-height: 560px)").matches;
  if (narrow && room.clientWidth < 600) {  // a phone: the app's narrow chat, its menu rail cut off
    const k = room.clientWidth / 460;
    win.style.width = room.clientWidth + "px"; win.style.height = 600 * k + "px";
    frame.style.width = "520px"; frame.style.height = "600px"; frame.style.left = -60 * k + "px"; frame.style.transform = `scale(${k})`;
    return;
  }
  const logical = narrow && room.clientWidth < 700 ? 900 : 1280;
  const k = narrow ? room.clientWidth / logical : Math.min(room.clientWidth / logical, room.clientHeight / 760);
  win.style.width = logical * k + "px"; win.style.height = 760 * k + "px";
  frame.style.left = ""; frame.style.height = "760px"; frame.style.width = logical + "px"; frame.style.transform = `scale(${k})`;
}
addEventListener("resize", fit); fit();

// It starts playing once the frame is ready (with reduced motion, only on Play or a step). The
// frame says it's ready with its first state message.
let started = false;
addEventListener("message", (e) => {
  if (e.source === frame.contentWindow && e.data?.tour === "state" && !started && !still) { started = true; send({ tour: "begin" }); }
});
frame.addEventListener("load", () => send({ tour: "hello" }));
send({ tour: "hello" });  // in case it loaded before this script ran
chrome();

// Intel Macs get the Intel download (as on index.html).
(async () => {
  try {
    const ua = navigator.userAgentData;
    if (!ua || !ua.getHighEntropyValues) return;
    const { architecture, platform } = await ua.getHighEntropyValues(["architecture"]);
    if (platform !== "macOS" || architecture !== "x86") return;
    document.querySelectorAll("a.dl").forEach((a) => { a.href = "https://github.com/Logesh883/vibepit-app/releases/latest/download/VibePit-x86_64.dmg"; });
  } catch (e) { /* keep the default */ }
})();
</script>
</body>
</html>
